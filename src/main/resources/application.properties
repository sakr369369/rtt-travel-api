#############################################################
# APPLICATION
#############################################################

server.port=8082
spring.application.name=RTTTravelCore

#############################################################
# DATABASE
#############################################################

spring.datasource.url=jdbc:postgresql://localhost:5432/rtt_travel_core_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

#############################################################
# JPA / HIBERNATE
#############################################################

# Use 'validate' in production once Liquibase is managing the schema.
# During initial development, 'update' is acceptable.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#############################################################
# HIKARI CONNECTION POOL
#############################################################

spring.datasource.hikari.pool-name=RTTTravelCorePool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

#############################################################
# LIQUIBASE
#############################################################

spring.liquibase.enabled=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

#############################################################
# JWT
#############################################################

jwt.secret=VGhpc0lzQVN0cm9uZzI1NkJpdEpXVFNlY3JldEtleUZvclJUVFRyYXZlbENvcmUyMDI2IQ==
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

#############################################################
# ACTUATOR
#############################################################

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

#############################################################
# SWAGGER
#############################################################

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html




#############################################################
# LOGGING
#############################################################

logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.springframework.security=INFO
logging.level.com.roottronics.travelcore=DEBUG

##################################################
# SUPER ADMIN BOOTSTRAP
##################################################

security.bootstrap.enabled=true

security.bootstrap.email=admin@roottronics.com

security.bootstrap.password=Admin@123

##################################################
# Local File Storage
##################################################
app.file.upload-dir=D:/Commercial_Projects/hr-domain/file-upload-test

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB